<svg xmlns="http://www.w3.org/2000/svg" width="420" height="80" viewBox="0 0 420 80" role="img" aria-label="Try the live demo: runs in your browser, nothing to install">
  <title>Try the live demo</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5468f0"/>
      <stop offset="1" stop-color="#3346c4"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#1b2042" flood-opacity="0.28"/>
    </filter>
  </defs>
  <g filter="url(#shadow)">
    <rect x="6" y="4" width="408" height="68" rx="34" fill="url(#bg)"/>
    <rect x="6" y="4" width="408" height="68" rx="34" fill="url(#shine)"/>
  </g>
  <circle cx="40" cy="38" r="24" fill="#ffffff"/>
  <!-- Lucide "play" -->
  <g transform="translate(29.5 26.5) scale(0.96)" fill="#3f56e0" stroke="#3f56e0" stroke-width="2" stroke-linejoin="round">
    <path d="M5 5a2 2 0 0 1 3.008-1.728l11.997 6.998a2 2 0 0 1 .003 3.458l-12 7A2 2 0 0 1 5 19z"/>
  </g>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#ffffff">
    <text x="78" y="36" font-size="23" font-weight="700" letter-spacing="-0.2">Try the live demo</text>
    <text x="78" y="57" font-size="13.5" fill-opacity="0.86">No install, runs in your browser</text>
  </g>
  <!-- Lucide "arrow-right" -->
  <g transform="translate(372 26)" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M5 12h14"/>
    <path d="m12 5 7 7-7 7"/>
  </g>
</svg>
