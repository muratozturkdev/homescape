# The demo site (site/Dockerfile). Static files only: the app talks to no server.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;

  # Short links to share
  location = /github {
    return 302 https://github.com/muratozturkdev/homescape;
  }
  location = /install {
    return 302 https://my.home-assistant.io/redirect/supervisor_add_addon_repository/?repository_url=https%3A%2F%2Fgithub.com%2Fmuratozturkdev%2Fhomescape;
  }

  # File names in assets/ carry a hash: cached for a year. The page itself is always checked again.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
  location /sounds/ {
    add_header Cache-Control "public, max-age=604800";
  }
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
